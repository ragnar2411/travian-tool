<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travian Inactive & Scout Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header & Server Selector -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg gap-4">
            <div>
                <h1 class="text-xl font-bold text-blue-400">Travian Inactive & Scout Analyzer</h1>
                <p class="text-xs text-slate-400">Advanced farm management and automated scouting tool.</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label class="text-xs text-slate-300 whitespace-nowrap">Active Server:</label>
                <input type="text" id="serverDomain" value="ts3.x1.arabics.travian.com" class="bg-slate-950 border border-slate-700 text-sm rounded px-3 py-1.5 text-blue-300 w-full md:w-64 focus:outline-none focus:border-blue-500">
            </div>
        </header>

        <!-- Actions Bar -->
        <div class="flex flex-wrap gap-3 items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <div class="flex gap-3">
                <button onclick="triggerScan()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                    Scan Inactives
                </button>
                <button onclick="openAllSelected()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow flex items-center gap-2">
                    <span>📂 Open All Selected</span>
                </button>
            </div>
            <span id="statusText" class="text-xs text-slate-400">Ready</span>
        </div>

        <!-- Targets Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="font-semibold text-sm">Inactive Targets</h2>
                <span id="targetCount" class="text-xs bg-blue-950 text-blue-400 px-2.5 py-1 rounded-full border border-blue-800">0 found</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs bg-slate-950/50">
                            <th class="p-3 w-10 text-center"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" class="rounded bg-slate-900 border-slate-700"></th>
                            <th class="p-3">Village</th>
                            <th class="p-3">Coords</th>
                            <th class="p-3">Distance</th>
                            <th class="p-3">Pop</th>
                            <th class="p-3">Player / Alliance</th>
                            <th class="p-3">Last Active</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="farmsTableBody" class="divide-y divide-slate-800/60">
                        <!-- Dynamic rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function loadFarms() {
            try {
                const res = await fetch('/api/farms');
                const data = await res.json();
                if (data.status === 'success') {
                    renderTable(data.data);
                }
            } catch (err) {
                console.error("Failed to load farms", err);
            }
        }

        function renderTable(farms) {
            const tbody = document.getElementById('farmsTableBody');
            tbody.innerHTML = '';
            document.getElementById('targetCount0' || 'targetCount').innerText = `${farms.length} found`;
            
            if (farms.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-500">No farms found. Click "Scan Inactives" to fetch targets.</td></tr>`;
                return;
            }

            farms.forEach(farm => {
                const server = document.getElementById('serverDomain').value;
                const travianLink = `https://${server}/position_details.php?x=${farm.x}&y=${farm.y}`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition';
                tr.innerHTML = `
                    <td class="p-3 text-center"><input type="checkbox" class="farm-checkbox rounded bg-slate-900 border-slate-700" data-x="${farm.x}" data-y="${farm.y}"></td>
                    <td class="p-3 font-medium text-slate-200">${farm.village}</td>
                    <td class="p-3 text-blue-400 font-mono">(${farm.x}|${farm.y})</td>
                    <td class="p-3 text-slate-300">${farm.distance} fields</td>
                    <td class="p-3 text-emerald-400">${farm.population}</td>
                    <td class="p-3 text-slate-300">${farm.player}</td>
                    <td class="p-3 text-slate-400 text-xs">${farm.last_active}</td>
                    <td class="p-3 text-center">
                        <a href="${travianLink}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-blue-300 px-3 py-1 rounded text-xs border border-slate-700 transition">Open</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSelectAll(master) {
            const checkboxes = document.querySelectorAll('.farm-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        async function triggerScan() {
            document.getElementById('statusText').innerText = "Scanning servers...";
            try {
                const res = await fetch('/api/scan', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('statusText').innerText = `Scan complete. Added ${data.added} new targets.`;
                    loadFarms();
                }
            } catch (err) {
                document.getElementById('statusText').innerText = "Scan failed.";
            }
        }

        function openAllSelected() {
            const checkedBoxes = document.querySelectorAll('.farm-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert("Please select at least one farm first.");
                return;
            }
            const server = document.getElementById('serverDomain').value;
            checkedBoxes.forEach(cb => {
                const x = cb.getAttribute('data-x');
                const y = cb.getAttribute('data-y');
                const url = `https://${server}/position_details.php?x=${x}&y=${y}`;
                window.open(url, '_blank');
            });
        }

        loadFarms();
    </script>
</body>
</html>
